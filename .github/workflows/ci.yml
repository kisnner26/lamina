name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show swift version
        run: swift --version

      - name: build and test
        run: swift test
